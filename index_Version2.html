<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPS - Declaração Pessoal de Saúde</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <main class="max-w-4xl mx-auto p-4 sm:p-8">
    <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-lg">
      <header class="border-b-4 border-orange-500 bg-slate-900 px-6 py-6 text-white">
        <div class="flex items-center gap-4">
          <div class="flex h-14 w-14 items-center justify-center rounded-xl bg-orange-500">
            <i data-lucide="heart-pulse" class="h-8 w-8"></i>
          </div>
          <div>
            <p class="text-sm text-orange-300">Qualy Invest Seguros</p>
            <h1 class="text-2xl font-bold">Declaração Pessoal de Saúde</h1>
          </div>
        </div>
      </header>

      <form id="dpsForm" class="space-y-8 p-6 sm:p-8">
        <section class="space-y-4">
          <h2 class="border-b pb-2 text-lg font-bold text-slate-900">Dados do titular</h2>
          <div class="grid gap-4 sm:grid-cols-2">
            <label class="sm:col-span-2">
              <span class="mb-1 block text-sm font-medium">Nome completo *</span>
              <input id="nome" required class="w-full rounded-lg border border-slate-300 px-4 py-3" placeholder="Nome completo">
            </label>
            <label>
              <span class="mb-1 block text-sm font-medium">E-mail *</span>
              <input id="email" type="email" required class="w-full rounded-lg border border-slate-300 px-4 py-3" placeholder="email@exemplo.com">
            </label>
            <label>
              <span class="mb-1 block text-sm font-medium">Telefone / WhatsApp *</span>
              <input id="telefone" required class="w-full rounded-lg border border-slate-300 px-4 py-3" placeholder="(11) 99999-9999">
            </label>
            <label>
              <span class="mb-1 block text-sm font-medium">Peso (kg) *</span>
              <input id="peso" type="number" step="0.1" min="1" required class="w-full rounded-lg border border-slate-300 px-4 py-3" placeholder="Ex: 70">
            </label>
            <label>
              <span class="mb-1 block text-sm font-medium">Altura (m ou cm) *</span>
              <input id="altura" required class="w-full rounded-lg border border-slate-300 px-4 py-3" placeholder="Ex: 1,75">
            </label>
          </div>
        </section>

        <section class="space-y-4">
          <h2 class="border-b pb-2 text-lg font-bold text-slate-900">Questionário de saúde</h2>
          <div id="questions" class="space-y-3"></div>
        </section>

        <label class="flex items-start gap-3 rounded-xl border border-slate-200 bg-slate-50 p-4">
          <input id="aceite" type="checkbox" required class="mt-1 h-4 w-4">
          <span class="text-sm">
            Declaro que as informações prestadas são verdadeiras e completas.
          </span>
        </label>

        <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl bg-orange-500 px-6 py-4 font-bold text-white hover:bg-orange-600">
          <i data-lucide="file-down" class="h-5 w-5"></i>
          Gerar PDF da DPS
        </button>
      </form>
    </section>
  </main>

  <script>
    const perguntas = [
      'Doenças cardiovasculares ou hipertensão arterial?',
      'Diabetes ou doenças endócrinas/metabólicas?',
      'Doenças respiratórias crônicas?',
      'Doenças neurológicas ou psiquiátricas?',
      'Problemas ortopédicos, de coluna ou articulações?',
      'Cirurgias ou internações nos últimos cinco anos?',
      'Uso contínuo de medicamentos ou tratamento em andamento?',
      'Gestação atual ou outra condição não listada?'
    ];

    const perguntasContainer = document.getElementById('questions');

    perguntas.forEach((pergunta, index) => {
      perguntasContainer.insertAdjacentHTML('beforeend', `
        <div class="rounded-xl border border-slate-200 p-4">
          <p class="mb-3 text-sm font-medium">${index + 1}. ${pergunta}</p>
          <div class="flex gap-2">
            <label class="flex-1 cursor-pointer">
              <input type="radio" name="q${index}" value="Não" class="peer sr-only" required>
              <span class="block rounded-lg border px-4 py-2 text-center text-sm peer-checked:border-slate-900 peer-checked:bg-slate-900 peer-checked:text-white">Não</span>
            </label>
            <label class="flex-1 cursor-pointer">
              <input type="radio" name="q${index}" value="Sim" class="peer sr-only" required>
              <span class="block rounded-lg border px-4 py-2 text-center text-sm peer-checked:border-orange-500 peer-checked:bg-orange-500 peer-checked:text-white">Sim</span>
            </label>
          </div>
          <textarea id="detalhe${index}" rows="2" class="mt-3 hidden w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="Descreva a condição, data aproximada e tratamento"></textarea>
        </div>
      `);

      const card = perguntasContainer.lastElementChild;
      card.querySelectorAll('input').forEach((radio) => {
        radio.addEventListener('change', () => {
          const detalhe = card.querySelector('textarea');
          if (radio.value === 'Sim') {
            detalhe.classList.remove('hidden');
            detalhe.required = true;
          } else {
            detalhe.classList.add('hidden');
            detalhe.required = false;
            detalhe.value = '';
          }
        });
      });
    });

    lucide.createIcons();

    document.getElementById('dpsForm').addEventListener('submit', (event) => {
      event.preventEventDefault;
    });
  </script>
</body>
</html>
